name: PiGO Framework CI Pipeline

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ staging, main ]

jobs:
  syntax-validation:
    name: PHP Syntax Check (Zero-Error)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate All PHP Files Syntax
        run: |
          echo "Memulai pemeriksaan sintaks seluruh berkas PHP..."
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; | grep -v "No syntax errors" || true

  zero-leakage-check:
    name: Zero-Leakage & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Verify No Secrets Staged
        run: |
          if git ls-files | grep -E "^\.env$|\.env\..*|credentials\.json$|id_rsa|\.key$|\.pem$"; then
            echo "ERROR [Zero-Leakage]: Berkas kredensial rahasia terdeteksi dalam repositori!"
            exit 1
          fi
          echo "OK: Repositori bersih dari berkas rahasia."
